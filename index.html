<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="spirit-data.js"></script>
    <title>Spirit Island Opening Strategy Logger</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: #1e1e24;
            color: white;
            font-size: 16px;
        }
        #livePreview {
            background: #111827;
            color: white;
            padding: 10px;
            font-family: monospace;
            word-break: break-all;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .charcoal-container {
            background: #2a2a35;
            padding: 20px;
        }
        .base-button {
            background: #3e3e47;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        .commit-action { background: #0f8c4a; }
        .clear-action  { background: #b91c1c; }
        .container-box {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 10px 0;
            width: 100%;
        }
        input, select, textarea {
            font-size: 16px;
            width: 100%;
            background: #3e3e47;
            border: 1px solid #3e3e47;
            color: white;
            padding: 10px;
            margin-bottom: 10px;
        }
        textarea#history {
            height: 150px;
            resize: none;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #0f8c4a;
            outline: none;
        }
    </style>
</head>
<body>

    <div id="livePreview"></div>

    <div class="charcoal-container">
        <select id="spiritSelector"></select>
        <div id="growthContainer" class="container-box"></div>
        <div id="trackContainer" class="container-box"></div>
        <div>
            <input id="cardInput">
            <button id="playCardBtn" class="base-button">+ Play Card</button>
            <div id="cardLibrary" class="container-box"></div>
        </div>
        <div>
            <input id="modifierInput">
            <button id="addModifierBtn" class="base-button">+ Add Modifier</button>
            <div id="modifierLibrary" class="container-box"></div>
        </div>
        <div>
            <button id="commitBtn" class="base-button commit-action">Commit Turn</button>
            <button id="clearBtn" class="base-button clear-action">Clear Turn</button>
        </div>
        <textarea id="history" readonly></textarea>
	<a href="https://github.com/lacing-maltese/si-opening-builder/blob/main/README.md" target="_blank" style="display:block;margin-top:16px;color:#9ca3af;font-size:14px;text-decoration:none;">Opening Notation Reference</a>
    </div>

<script>
let leftTokens = [];
let rightTokens = [];
let lastSide = null;

document.addEventListener('DOMContentLoaded', () => {
    Object.keys(SPIRIT_DATABASE).forEach(spiritName => {
        const option = document.createElement('option');
        option.value = spiritName;
        option.textContent = spiritName;
        document.getElementById('spiritSelector').appendChild(option);
    });

    document.getElementById('spiritSelector').addEventListener('change', (e) => renderProfile(e.target.value));
    document.getElementById('playCardBtn').onclick = () => handleManualCard();
    document.getElementById('addModifierBtn').onclick = () => handleManualModifier();
    document.getElementById('commitBtn').onclick = commitTurn;
    document.getElementById('clearBtn').onclick = clearCurrentTurn;

    document.getElementById('history').onclick = () => {
        const ta = document.getElementById('history');
        if (!ta.value) return;
        ta.focus();
        ta.setSelectionRange(0, ta.value.length);
    };

    renderProfile("Generic");
});

function renderProfile(spiritName) {
    leftTokens = [];
    rightTokens = [];
    lastSide = null;
    updatePreview();

    const spiritData = SPIRIT_DATABASE[spiritName];
    document.getElementById('growthContainer').innerHTML = '';
    document.getElementById('trackContainer').innerHTML = '';
    document.getElementById('cardLibrary').innerHTML = '';
    document.getElementById('modifierLibrary').innerHTML = '';

    spiritData.growth.forEach(token => {
        const btn = document.createElement('button');
        btn.className = 'base-button';
        btn.textContent = token;
        btn.onclick = () => logTokenEntry(token);
        document.getElementById('growthContainer').appendChild(btn);
    });

    spiritData.tracks.forEach(token => {
        const btn = document.createElement('button');
        btn.className = 'base-button';
        btn.textContent = token;
        btn.onclick = () => logTokenEntry(token);
        document.getElementById('trackContainer').appendChild(btn);
    });

    spiritData.cards.forEach(card => {
        addShortcutToLibrary(card, 'cardLibrary', () => executeCardPlay(card));
    });

    spiritData.modifiers.forEach(modifier => {
        addShortcutToLibrary(modifier, 'modifierLibrary', () => executeModifier(modifier));
    });
}

function logTokenEntry(token) {
    leftTokens.push(token);
    lastSide = 'left';
    updatePreview();
}

function handleManualCard() {
    const cardName = document.getElementById('cardInput').value.trim();
    if (cardName === '') return;
    addShortcutToLibrary(cardName, 'cardLibrary', () => executeCardPlay(cardName));
    executeCardPlay(cardName);
    document.getElementById('cardInput').value = '';
}

function executeCardPlay(cardName) {
    rightTokens.push(cardName);
    lastSide = 'right';
    updatePreview();
}

function handleManualModifier() {
    const modifierText = document.getElementById('modifierInput').value.trim();
    if (modifierText === '') return;
    addShortcutToLibrary(modifierText, 'modifierLibrary', () => executeModifier(modifierText));
    executeModifier(modifierText);
    document.getElementById('modifierInput').value = '';
}

function executeModifier(modifierText) {
    if (lastSide === 'right' && rightTokens.length > 0) {
        rightTokens[rightTokens.length - 1] += "(" + modifierText + ")";
    } else if (lastSide === 'left' && leftTokens.length > 0) {
        leftTokens[leftTokens.length - 1] += "(" + modifierText + ")";
    }
    updatePreview();
}

function addShortcutToLibrary(text, targetContainerId, executionCallback) {
    const container = document.getElementById(targetContainerId);
    const existingButtons = container.querySelectorAll('.base-button');
    for (let i = 0; i < existingButtons.length; i++) {
        if (existingButtons[i].textContent === text) return;
    }
    const btn = document.createElement('button');
    btn.className = 'base-button';
    btn.textContent = text;
    btn.onclick = executionCallback;
    container.appendChild(btn);
}

function clearCurrentTurn() {
    leftTokens = [];
    rightTokens = [];
    lastSide = null;
    updatePreview();
}

function commitTurn() {
    const full = buildFullString();
    if (!full) return;
    document.getElementById('history').value += full + " | ";
    leftTokens = [];
    rightTokens = [];
    lastSide = null;
    updatePreview();
}

function buildFullString() {
    const left = leftTokens.join('');
    const right = rightTokens.join(',');
    if (!left && !right) return '';
    if (!right) return left;
    if (!left) return ':' + right;
    return left + ':' + right;
}

function updatePreview() {
    const preview = document.getElementById('livePreview');
    preview.innerHTML = '';

    const left = [...leftTokens];
    const right = [...rightTokens];
    const hasLeft = left.length > 0;
    const hasRight = right.length > 0;

    left.forEach((token, i) => {
        const span = document.createElement('span');
        span.textContent = token;
        if (lastSide === 'left' && i === left.length - 1) span.style.color = '#fbbf24';
        preview.appendChild(span);
    });

    if (hasRight) {
        const sep = document.createElement('span');
        sep.textContent = ':';
        preview.appendChild(sep);
    }

    right.forEach((token, i) => {
        if (i > 0) {
            const comma = document.createElement('span');
            comma.textContent = ',';
            preview.appendChild(comma);
        }
        const span = document.createElement('span');
        span.textContent = token;
        if (lastSide === 'right' && i === right.length - 1) span.style.color = '#fbbf24';
        preview.appendChild(span);
    });
}
</script>
</body>
</html>
